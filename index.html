<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World Clock</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.6.0/moment-timezone-with-data-1970-2030.min.js"></script>
  </head>
  <body>
    <div class="container">
      <h1>World Clock</h1>
      
      <select id="city">
        <option value="">Choose a city</option>
        <option value="current">My current location</option>
        <option value="America/New_York">New York</option>
        <option value="Europe/Paris">Paris</option>
        <option value="Australia/Sydney">Sydney</option>
        <option value="Africa/Nairobi">Nairobi</option>
      </select>

      <div id="cities">
      <div class="city" id="new-york">
        <h2>New York</h2>
        <div class="date"></div>
        <div class="time"></div>
      </div>
      <div class="city" id="paris">
        <h2>Paris</h2>
        <div class="date"></div>
        <div class="time"></div>
      </div>
    </div>
    </div>

    <footer>
      This project was coded by <strong>Matilda Mathebula</strong> and is open
      sourced on
      <a href="https://github.com/MatildaMathebula" target="_blank">Github</a>
    </footer>
    <script src="class.js"></script>
  </body>
</html>
